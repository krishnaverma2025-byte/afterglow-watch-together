<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Afterglow streaming party</title><style>body{width:340px;padding:18px;margin:0;background:#191719;color:#eee;font:13px system-ui}h1{color:#eeb19a;font-size:25px}p{line-height:1.6;color:#c6b7af;font-size:12px}label{display:block;margin:14px 0}input:not([type=checkbox]){display:block;box-sizing:border-box;width:100%;padding:10px;margin-top:6px;background:#100f10;border:1px solid #6a4c40;border-radius:6px;color:#fff}button{background:#eeb19a;border:0;padding:11px 16px;border-radius:6px;cursor:pointer;font-weight:bold}button:disabled{opacity:.4}a{color:#eeb19a}#status{white-space:pre-wrap}hr{border:0;border-top:1px solid #4a3c35;margin:22px 0}</style><script type="module" src="popup.js"></script></head><body><h1>◐ afterglow</h1><p>Start a movie on Netflix, Prime Video or Hotstar, then create or join your party.</p><p id="identity"></p><label>Your name<input id="name" maxlength="32" placeholder="Your name"></label><label>Party name<input id="title" maxlength="80" placeholder="Movie night"></label><label><input id="hostOnly" type="checkbox" checked> Only I control playback</label><button id="create">Create party</button><hr><label>Invitation link<input id="invite" placeholder="http://localhost:3000/party/…"></label><button id="join">Join party</button><p id="status" role="status"></p><a id="openTitle" target="_blank" rel="noopener" hidden>Open the party’s video ↗</a><p>One-time pairing: copy this full extension origin into Afterglow’s streaming setup page:</p><input id="extensionId" readonly aria-label="Extension origin"><p><a href="http://localhost:3000/streaming" target="_blank" rel="noopener">Open setup & instructions ↗</a></p></body></html>
